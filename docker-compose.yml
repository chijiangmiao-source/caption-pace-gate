services:
  web:
    build: .
    image: subtitle-rhythm-gate-web:latest
    ports:
      # WEB_PORT 覆盖宿主端口，容器内固定 4173
      - "${WEB_PORT:-8080}:4173"
    restart: unless-stopped

  # 一次性验收服务：等 web 健康检查通过后再跑端到端用例，结束即退出
  verify:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    depends_on:
      web:
        # 确定性等待：健康探针通过（页面真正可服务）才启动验收
        condition: service_healthy
    environment:
      PLAYWRIGHT_BASE_URL: http://web:4173
    volumes:
      - ./:/app
      # 命名卷隔离容器内依赖，避免被宿主 node_modules 遮蔽
      - verify_node_modules:/app/node_modules
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -e
        npm ci
        npx playwright test -c playwright.docker.config.ts

volumes:
  verify_node_modules:
